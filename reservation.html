<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحجز والمناسبات | NOIR & FIRE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="logo nour res.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; } 
    </style>
</head>
<body class="bg-[#0D0D11] text-[#E4E4E8]">

    <!-- الهيدر / القائمة العلوية -->
    <header class="fixed w-full top-0 z-50 bg-[#0D0D11]/90 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-white">NOIR <span class="text-[#FF6B35]">&</span> FIRE</a>
            <nav class="hidden lg:flex items-center gap-8 text-sm font-semibold">
                <a href="index.html" class="hover:text-[#FF6B35]">الرئيسية</a>
                <a href="about.html" class="hover:text-[#FF6B35]">عن المطعم</a>
                <a href="menu.html" class="hover:text-[#FF6B35]">قائمة الطعام</a>
                <a href="reservation.html" class="text-[#FF6B35]">الحجز والمناسبات</a>
                <a href="contact.html" class="hover:text-[#FF6B35]">اتصل بنا</a>
            </nav>
        </div>
    </header>

    <!-- قسم نموذج الحجز -->
    <section class="pt-32 pb-20 px-6 min-h-screen flex items-center justify-center">
        <div class="max-w-3xl w-full bg-[#14141C] p-8 md:p-12 rounded-3xl border border-white/10 shadow-2xl">
            <div class="text-center mb-8">
                <span class="text-[#FF6B35] text-xs font-bold uppercase tracking-widest">تأكيد سريع ورسمي</span>
                <h1 class="text-3xl md:text-4xl font-black text-white mt-1">حجز طاولة أو مناسبة خاصة</h1>
            </div>

            <form onsubmit="sendBooking(event)" class="space-y-5">
                <div class="grid md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-2">نوع الحجز *</label>
                        <select id="type" required class="w-full bg-[#0D0D11] border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-[#FF6B35] text-sm">
                            <option value="حجز طاولة عادية">حجز طاولة عادية</option>
                            <option value="حفلة ميلاد / ذكرى سنوية">حفلة ميلاد / ذكرى سنوية</option>
                            <option value="عشاء عمل خاص VIP">عشاء عمل خاص VIP</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-2">الاسم بالكامل *</label>
                        <input type="text" id="name" required placeholder="أدخل اسمك بالكامل" class="w-full bg-[#0D0D11] border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-[#FF6B35] text-sm">
                    </div>
                </div>

                <div class="grid md:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-2">رقم الهاتف *</label>
                        <input type="tel" id="phone" required placeholder="010XXXXXXXX" class="w-full bg-[#0D0D11] border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-[#FF6B35] text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-2">التاريخ *</label>
                        <input type="date" id="date" required class="w-full bg-[#0D0D11] border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-[#FF6B35] text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-300 mb-2">الوقت *</label>
                        <input type="time" id="time" required class="w-full bg-[#0D0D11] border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-[#FF6B35] text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-2">تفاصيل إضافية / طلبات خاصة</label>
                    <textarea id="notes" rows="3" class="w-full bg-[#0D0D11] border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-[#FF6B35] text-sm" placeholder="مثل: كيكة خاصة، تزيين الطاولة..."></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm py-4 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i> إرسال الطلب فوراً إلى الواتساب
                </button>
            </form>
        </div>
    </section>

    <!-- سكربت تجميع البيانات وإرسالها إلى الواتساب -->
    <script>
        function sendBooking(e) {
            e.preventDefault();

            // قراءة البيانات المُدخلة من الحقول
            const type = document.getElementById('type').value.trim();
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const date = document.getElementById('date').value.trim();
            const time = document.getElementById('time').value.trim();
            const notes = document.getElementById('notes').value.trim() || 'لا يوجد';

            // تنسيق الرسالة بشكل مرتب على الواتساب
            const textMessage = `*طلب حجز جديد - NOIR & FIRE*\n\n` +
                                `📌 *نوع الحجز:* ${type}\n` +
                                `👤 *الاسم بالكامل:* ${name}\n` +
                                `📱 *رقم الهاتف:* ${phone}\n` +
                                `📅 *التاريخ:* ${date}\n` +
                                `⏰ *الوقت:* ${time}\n` +
                                `📝 *تفاصيل إضافية:* ${notes}`;

            // فتح الواتساب بالرقم والمحتوى المنسق
            const whatsappNumber = "201025134834";
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(textMessage)}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
